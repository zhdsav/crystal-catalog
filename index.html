<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Factory Price List</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --gold:#b8860b; --gold-light:#d4af37; --ink:#222; --muted:#888;
    --bg:#f6f4ef; --card:#fff;
  }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .toolbar {
    position:sticky; top:0; z-index:50;
    background:linear-gradient(135deg,#2b2118 0%,#4a3623 100%);
    color:#fff; padding:14px 20px; box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  .toolbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; flex-direction:column; line-height:1.2; }
  .brand .title { font-size:20px; font-weight:700; letter-spacing:2px; }
  .brand .sub { font-size:12px; color:#d9c7a8; margin-top:2px; }
  .spacer { flex:1; }
  .search { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 12px; }
  .search input { background:transparent; border:none; outline:none; color:#fff; font-size:14px; width:160px; }
  .search input::placeholder { color:#cbb89a; }
  .search .icon { color:#d9c7a8; }
  select, .btn { border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; border-radius:8px; padding:7px 12px; font-size:14px; cursor:pointer; outline:none; }
  select option { color:#222; background:#fff; }
  .btn { background:var(--gold); border-color:var(--gold); font-weight:600; letter-spacing:1px; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--gold-light); }
  .statbar { max-width:1200px; margin:16px auto 0; padding:0 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
  .statbar b { color:var(--gold); }
  .grid { max-width:1200px; margin:12px auto; padding:0 20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:18px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .18s, box-shadow .18s; cursor:pointer; position:relative; }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 22px rgba(0,0,0,.12); }
  .thumb { position:relative; aspect-ratio:1/1; overflow:hidden; background:#eee; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .25s; }
  .thumb img.second { opacity:0; }
  .card:hover .thumb img.second { opacity:1; }
  .card:hover .thumb img.first { opacity:0; }
  .badge { position:absolute; top:8px; left:8px; z-index:2; background:rgba(0,0,0,.55); color:#fff; font-size:11px; padding:2px 8px; border-radius:20px; }
  .multi-badge { position:absolute; top:8px; right:8px; z-index:2; background:var(--gold); color:#fff; font-size:11px; padding:2px 8px; border-radius:20px; }
  .card .info { padding:12px 14px; display:flex; align-items:baseline; justify-content:space-between; }
  .card .name { font-size:14px; font-weight:600; color:var(--ink); }
  .card .price { font-size:16px; font-weight:700; color:#c0392b; }
  .card .price .cur { font-size:12px; }
  .card .price.na { color:var(--muted); font-weight:500; font-size:14px; }
  .pager { max-width:1200px; margin:20px auto 40px; padding:0 20px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .pager button { min-width:36px; height:36px; padding:0 10px; border:1px solid #ddd; background:#fff; color:var(--ink); border-radius:8px; font-size:14px; cursor:pointer; }
  .pager button:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
  .pager button.active { background:var(--gold); border-color:var(--gold); color:#fff; }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager .ellipsis { color:var(--muted); padding:0 4px; }
  .footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; border-top:1px solid #e5e0d5; }
  .footer .phone { color:var(--gold); font-weight:600; }
  /* ===== 购物车 ===== */
  .add-btn { width:100%; padding:8px; border:1px solid var(--gold); background:#fff; color:var(--gold); border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px; }
  .add-btn:hover, .add-btn.in { background:var(--gold); color:#fff; }
  .cart-fab { position:fixed; right:20px; bottom:24px; z-index:60; width:58px; height:58px; border-radius:50%; background:var(--gold); color:#fff; border:none; box-shadow:0 4px 16px rgba(0,0,0,.28); cursor:pointer; font-size:26px; display:flex; align-items:center; justify-content:center; }
  .cart-fab .cnt { position:absolute; top:-4px; right:-4px; min-width:22px; height:22px; background:#c0392b; color:#fff; border-radius:11px; font-size:12px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 5px; }
  .cart-panel { position:fixed; top:0; right:0; bottom:0; width:360px; max-width:92vw; z-index:70; background:#fff; box-shadow:-4px 0 20px rgba(0,0,0,.22); transform:translateX(105%); transition:transform .25s; display:flex; flex-direction:column; }
  .cart-panel.open { transform:translateX(0); }
  .cart-head { padding:16px 18px; background:linear-gradient(135deg,#2b2118,#4a3623); color:#fff; display:flex; justify-content:space-between; align-items:center; }
  .cart-head .t { font-size:17px; font-weight:700; letter-spacing:1px; }
  .cart-head .x { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; line-height:1; }
  .cart-body { flex:1; overflow-y:auto; padding:12px 16px; }
  .cart-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #eee; align-items:center; }
  .cart-item img { width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .cart-item .ci-mid { flex:1; min-width:0; }
  .cart-item .ci-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cart-item .ci-price { font-size:12px; color:var(--muted); margin:3px 0; }
  .qty { display:inline-flex; align-items:center; border:1px solid #ddd; border-radius:6px; overflow:hidden; }
  .qty button { width:26px; height:26px; border:none; background:#f5f5f5; cursor:pointer; font-size:15px; line-height:1; }
  .qty input { width:64px; text-align:center; font-size:13px; border:none; outline:none; background:#fff; }
  .cart-item .ci-sub { font-size:14px; font-weight:700; color:#c0392b; margin-left:6px; }
  .ci-del { background:none; border:none; color:#ccc; cursor:pointer; font-size:18px; line-height:1; }
  .ci-del:hover { color:#c0392b; }
  .cart-empty { text-align:center; color:var(--muted); padding:48px 0; font-size:14px; }
  .cart-foot { padding:14px 18px; border-top:1px solid #eee; }
  .cart-total { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; font-weight:600; margin-bottom:12px; }
  .cart-total .sum { color:#c0392b; font-size:22px; font-weight:700; }
  .cart-foot .btn { width:100%; justify-content:center; padding:12px; font-size:15px; }
  .cart-foot .btn.ghost { background:#fff; border:1px solid #ddd; color:var(--ink); margin-bottom:8px; }
  .cart-foot .btn.ghost:hover { border-color:var(--gold); color:var(--gold); }
  /* ===== 账单弹窗 ===== */
  .invoice-modal { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px; }
  .invoice-modal.open { display:flex; }
  .invoice-box { background:#fff; border-radius:12px; max-width:560px; width:100%; max-height:92vh; overflow-y:auto; padding:26px; }
  .invoice-box h2 { font-size:19px; letter-spacing:.5px; margin-bottom:4px; }
  .iv-date { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .iv-cust { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .iv-cust input { padding:9px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px; }
  .iv-cust input:focus { outline:none; border-color:var(--gold); }
  .iv-table { width:100%; border-collapse:collapse; margin-bottom:16px; font-size:13px; }
  .iv-table th, .iv-table td { border-bottom:1px solid #eee; padding:8px 6px; text-align:left; }
  .iv-table th { color:var(--muted); font-weight:600; font-size:12px; }
  .iv-table .num { text-align:right; }
  .iv-total { text-align:right; font-size:16px; font-weight:600; margin-bottom:18px; }
  .iv-total .sum { color:#c0392b; font-size:24px; font-weight:700; }
  .iv-actions { display:flex; gap:10px; }
  .iv-actions .btn { flex:1; justify-content:center; padding:12px; }
  .submit-btn { width:100%; justify-content:center; padding:14px; font-size:16px; margin-top:10px; background:#c0392b; border-color:#c0392b; }
  .submit-btn:hover { background:#e74c3c; border-color:#e74c3c; }
  .lightbox { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; }
  .lightbox.open { display:flex; }
  .lightbox .lb-inner { position:relative; max-width:90vw; max-height:90vh; text-align:center; }
  .lightbox img { max-width:90vw; max-height:76vh; border-radius:8px; object-fit:contain; background:#000; }
  .lightbox .lb-name { color:#fff; font-size:16px; margin-top:12px; }
  .lightbox .lb-price { color:var(--gold-light); font-size:18px; font-weight:700; margin-top:4px; }
  .lightbox .lb-nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:22px; cursor:pointer; line-height:1; }
  .lightbox .lb-nav:hover { background:rgba(255,255,255,.3); }
  .lightbox .lb-prev { left:-60px; }
  .lightbox .lb-next { right:-60px; }
  .lightbox .lb-close { position:absolute; top:-40px; right:0; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px; cursor:pointer; }
  .lightbox .lb-count { position:absolute; bottom:-40px; left:0; right:0; color:#bbb; font-size:13px; }
  @media (max-width:640px) {
    .toolbar-inner { gap:10px; }
    .brand .title { font-size:17px; }
    .search input { width:120px; }
    .grid { grid-template-columns:repeat(2, 1fr); gap:10px; padding:0 10px; }
    .card .info { padding:8px 10px; }
    .card .name { font-size:12px; }
    .card .price { font-size:14px; }
    .lightbox .lb-prev { left:6px; }
    .lightbox .lb-next { right:6px; }
  }
  @media print {
    body { background:#fff; }
    .toolbar, .statbar, .pager, .footer, .lightbox, .cart-fab, .cart-panel { display:none !important; }
    .invoice-modal { display:none !important; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:0; max-width:none; margin:0; }
    .card { box-shadow:none; border:1px solid #ccc; border-radius:4px; break-inside:avoid; page-break-inside:avoid; }
    .card:hover { transform:none; box-shadow:none; }
    .card .info { padding:6px 8px; }
    .card .name { font-size:11px; }
    .card .price { font-size:12px; }
    .card .add-btn { display:none !important; }
    .thumb img.second { opacity:0 !important; }
    .thumb img.first { opacity:1 !important; }
    body.printing-invoice .grid { display:none !important; }
    body.printing-invoice .invoice-modal { display:flex !important; position:static; background:#fff; padding:0; align-items:flex-start; }
    body.printing-invoice .invoice-box { max-height:none; max-width:none; box-shadow:none; border:none; padding:0; }
    body.printing-invoice .iv-actions { display:none !important; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="brand">
        <span class="title">Crystal Factory Price List</span>
        <span class="sub"><b>149</b> items · ¥6.5 ~ ¥32.5</span>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <span class="icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Search product No., e.g. 001">
      </div>
      <select id="priceFilter">
        <option value="">All prices</option>
        <option value="0-10">Under ¥10</option>
        <option value="10-15">¥10 ~ 15</option>
        <option value="15-20">¥15 ~ 20</option>
        <option value="20-25">¥20 ~ 25</option>
        <option value="25-99">¥25 and above</option>
        <option value="na">Not priced</option>
      </select>
      <select id="pageSize">
        <option value="12">12 / page</option>
        <option value="24" selected>24 / page</option>
        <option value="48">48 / page</option>
        <option value="149">All</option>
      </select>
      <button class="btn" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div>
  <div class="statbar" id="statbar"></div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
  <div class="footer">
    Crystal Factory Price List · Welcome to order · Tel: <span class="phone">________</span>　WeChat: <span class="phone">________</span>
  </div>
  <div class="lightbox" id="lightbox">
    <div class="lb-inner">
      <img id="lbImg" src="" alt="">
      <button class="lb-nav lb-prev" id="lbPrev" onclick="lbNav(-1)">‹</button>
      <button class="lb-nav lb-next" id="lbNext" onclick="lbNav(1)">›</button>
      <button class="lb-close" onclick="closeLb()">✕</button>
      <div class="lb-name" id="lbName"></div>
      <div class="lb-price" id="lbPrice"></div>
      <div class="lb-count" id="lbCount"></div>
    </div>
  </div>
  <!-- 购物车球 -->
  <button class="cart-fab" id="cartFab" onclick="toggleCart()">🛒<span class="cnt" id="cartCnt">0</span></button>
  <!-- 购物车面板 -->
  <div class="cart-panel" id="cartPanel">
    <div class="cart-head">
      <span class="t">🛒 Cart</span>
      <button class="x" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Total</span><span class="sum" id="cartTotal">¥0.00</span></div>
      <button class="btn ghost" onclick="clearCart()">Clear cart</button>
      <button class="btn" onclick="openInvoice()">📄 Generate Invoice</button>
    </div>
  </div>
  <!-- 账单弹窗 -->
  <div class="invoice-modal" id="invoiceModal">
    <div class="invoice-box">
      <h2>Crystal Factory Price List - Invoice</h2>
      <div class="iv-date" id="ivDate"></div>
      <div class="iv-cust">
        <input id="ivName" placeholder="Your name">
        <input id="ivPhone" placeholder="Phone / WhatsApp">
        <input id="ivWechat" placeholder="WeChat">
      </div>
      <table class="iv-table">
        <thead><tr><th>Product</th><th>Unit</th><th class="num">Qty</th><th class="num">Subtotal</th></tr></thead>
        <tbody id="ivBody"></tbody>
      </table>
      <div class="iv-total">Total: <span class="sum" id="ivTotal">¥0.00</span></div>
      <div class="iv-actions">
        <button class="btn" onclick="printInvoice()">🖨 Print / PDF</button>
        <button class="btn" onclick="copyInvoice()">📋 Copy Order</button>
      </div>
      <button class="btn submit-btn" id="submitBtn" onclick="submitOrder()">📤 Submit Order</button>
    </div>
  </div>

const state = { keyword:'', price:'', page:1, pageSize:24 };
function fmtPrice(p) {
  if (p === null || p === undefined || p === '') return null;
  const n = Number(p);
  return Number.isFinite(n) ? n : null;
}
function priceText(p) {
  const n = fmtPrice(p);
  return n === null ? 'Negotiable' : '¥' + n.toFixed(2);
}
function filtered() {
  let list = PRODUCTS.slice();
  if (state.keyword) {
    const kw = state.keyword.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(kw) || String(p.id).includes(kw));
  }
  if (state.price) {
    list = list.filter(p => {
      const n = fmtPrice(p.price);
      if (state.price === 'na') return n === null;
      const [lo, hi] = state.price.split('-').map(Number);
      if (n === null) return false;
      return n >= lo && n < hi;
    });
  }
  return list;
}
function render() {
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * state.pageSize;
  const pageList = list.slice(start, start + state.pageSize);
  document.getElementById('statbar').innerHTML =
    '<b>' + list.length + '</b> items' +
    (state.keyword || state.price ? ' (filtered)' : '') +
    ' · Page ' + state.page + '/' + totalPages;
  const grid = document.getElementById('grid');
  grid.innerHTML = pageList.map(p => {
    const imgs = p.images || [];
    const first = imgs[0] || '';
    const has2 = imgs.length > 1;
    const secondImg = has2 ? '<img class="second" src="' + imgs[1] + '" alt="">' : '';
    const price = fmtPrice(p.price);
    const priceHtml = price === null
      ? '<span class="price na">Negotiable</span>'
      : '<span class="price"><span class="cur">¥</span>' + price.toFixed(2) + '</span>';
    return '' +
      '<div class="card">' +
        '<div class="thumb" onclick="openLb(' + p.id + ')">' +
          '<span class="badge">' + p.name + '</span>' +
          (has2 ? '<span class="multi-badge">2 pics</span>' : '') +
          '<img class="first" src="' + first + '" alt="' + p.name + '">' +
          secondImg +
        '</div>' +
        '<div class="info">' +
          '<span class="name">' + p.name + '</span>' +
          priceHtml +
        '</div>' +
        '<button class="add-btn' + (cart[p.id] ? ' in' : '') + '" onclick="addToCart(' + p.id + ');this.classList.add(\'in\');">+ Add 1000</button>' +
      '</div>';
  }).join('');
  renderPager(totalPages);
}
function renderPager(totalPages) {
  const pager = document.getElementById('pager');
  let html = '<button ' + (state.page===1?'disabled':'') + ' onclick="go(' + (state.page-1) + ')">‹</button>';
  const pages = pageList(totalPages, state.page);
  for (const p of pages) {
    if (p === '...') html += '<span class="ellipsis">…</span>';
    else html += '<button class="' + (p===state.page?'active':'') + '" onclick="go(' + p + ')">' + p + '</button>';
  }
  html += '<button ' + (state.page===totalPages?'disabled':'') + ' onclick="go(' + (state.page+1) + ')">›</button>';
  pager.innerHTML = html;
}
function pageList(total, cur) {
  if (total <= 7) { const a=[]; for(let i=1;i<=total;i++)a.push(i); return a; }
  const set = new Set([1, total, cur-1, cur, cur+1]);
  const arr = [1];
  for (let i=2;i<=total-1;i++) if (set.has(i)) arr.push(i);
  const out = []; let prev = 0;
  for (const n of arr) { if (n - prev > 1) out.push('...'); out.push(n); prev = n; }
  return out;
}
function go(p) { state.page = p; render(); window.scrollTo({top:0, behavior:'smooth'}); }
let lbData = null, lbIdx = 0;
function openLb(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  lbData = p; lbIdx = 0;
  document.getElementById('lightbox').classList.add('open');
  lbRender();
}
function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
function lbNav(d) {
  if (!lbData) return;
  const n = lbData.images.length;
  lbIdx = (lbIdx + d + n) % n;
  lbRender();
}
function lbRender() {
  if (!lbData) return;
  const imgs = lbData.images || [];
  document.getElementById('lbImg').src = imgs[lbIdx] || '';
  document.getElementById('lbName').textContent = lbData.name;
  document.getElementById('lbPrice').textContent = priceText(lbData.price);
  document.getElementById('lbCount').textContent = imgs.length > 1 ? (lbIdx+1) + ' / ' + imgs.length : '';
  document.getElementById('lbPrev').style.display = imgs.length > 1 ? '' : 'none';
  document.getElementById('lbNext').style.display = imgs.length > 1 ? '' : 'none';
}
document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLb(); });
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
document.getElementById('searchInput').addEventListener('input', function(e) { state.keyword = e.target.value; state.page = 1; render(); });
document.getElementById('priceFilter').addEventListener('change', function(e) { state.price = e.target.value; state.page = 1; render(); });
document.getElementById('pageSize').addEventListener('change', function(e) { state.pageSize = Number(e.target.value); state.page = 1; render(); });

// ===== 购物车 =====
let cart = {};
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch(e) { cart = {}; }
function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
function cartCount() { return Object.keys(cart).reduce(function(a,k){ return a + (cart[k] || 0); }, 0); }
function cartTotal() {
  return Object.keys(cart).reduce(function(sum,k){
    var p = PRODUCTS.find(function(x){ return String(x.id) === k; });
    var n = fmtPrice(p ? p.price : null);
    return n === null ? sum : sum + n * cart[k];
  }, 0);
}
function addToCart(id) { var k = String(id); cart[k] = (cart[k] || 0) + 1000; saveCart(); }
function changeQty(id, d) { var k = String(id); cart[k] = (cart[k] || 0) + d; if (cart[k] <= 0) delete cart[k]; saveCart(); renderCart(); }
function setQty(id, v) { var k = String(id); var n = parseInt(v, 10); if (isNaN(n) || n < 1) { renderCart(); return; } cart[k] = n; saveCart(); renderCart(); }
function clearCart() { cart = {}; saveCart(); renderCart(); }
function updateCartUI() {
  var c = cartCount();
  var cnt = document.getElementById('cartCnt');
  cnt.style.display = c ? 'flex' : 'none';
  cnt.textContent = c;
  document.getElementById('cartTotal').textContent = '¥' + cartTotal().toFixed(2);
}
function renderCart() {
  updateCartUI();
  var body = document.getElementById('cartBody');
  var keys = Object.keys(cart);
  if (!keys.length) { body.innerHTML = '<div class="cart-empty">Your cart is empty</div>'; return; }
  body.innerHTML = keys.map(function(k){
    var p = PRODUCTS.find(function(x){ return String(x.id) === k; });
    if (!p) return '';
    var q = cart[k];
    var price = fmtPrice(p.price);
    var sub = price === null ? null : price * q;
    var img = (p.images && p.images[0]) || '';
    return '<div class="cart-item">' +
      '<img src="' + img + '" alt="">' +
      '<div class="ci-mid">' +
        '<div class="ci-name">' + p.name + '</div>' +
        '<div class="ci-price">' + priceText(p.price) + '</div>' +
        '<div class="qty"><button onclick="changeQty(\'' + k + '\',-1000)">-</button><input type="number" min="1" value="' + q + '" onchange="setQty(\'' + k + '\',this.value)"><button onclick="changeQty(\'' + k + '\',1000)">+</button></div>' +
      '</div>' +
      '<div class="ci-sub">' + (sub === null ? 'Negotiable' : '¥' + sub.toFixed(2)) + '</div>' +
      '<button class="ci-del" onclick="changeQty(\'' + k + '\',-' + q + ')">✕</button>' +
    '</div>';
  }).join('');
}
function toggleCart() { document.getElementById('cartPanel').classList.toggle('open'); renderCart(); }
function openInvoice() {
  if (!cartCount()) { alert('Your cart is empty'); return; }
  var d = new Date();
  document.getElementById('ivDate').textContent = 'Date: ' + d.toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
  document.getElementById('ivBody').innerHTML = Object.keys(cart).map(function(k){
    var p = PRODUCTS.find(function(x){ return String(x.id) === k; });
    if (!p) return '';
    var q = cart[k];
    var price = fmtPrice(p.price);
    var sub = price === null ? null : price * q;
    return '<tr><td>' + p.name + '</td><td>' + priceText(p.price) + '</td><td class="num">' + q + '</td><td class="num">' + (sub === null ? 'Negotiable' : '¥' + sub.toFixed(2)) + '</td></tr>';
  }).join('');
  document.getElementById('ivTotal').textContent = '¥' + cartTotal().toFixed(2);
  document.getElementById('invoiceModal').classList.add('open');
  document.getElementById('cartPanel').classList.remove('open');
}
function closeInvoice() { document.getElementById('invoiceModal').classList.remove('open'); }
function invoiceText() {
  var lines = [];
  lines.push('Crystal Factory Price List - Invoice');
  lines.push(document.getElementById('ivDate').textContent);
  var name = document.getElementById('ivName').value.trim();
  var phone = document.getElementById('ivPhone').value.trim();
  var wechat = document.getElementById('ivWechat').value.trim();
  if (name) lines.push('Name: ' + name);
  if (phone) lines.push('Phone: ' + phone);
  if (wechat) lines.push('WeChat: ' + wechat);
  lines.push('--------------------------------');
  Object.keys(cart).forEach(function(k){
    var p = PRODUCTS.find(function(x){ return String(x.id) === k; });
    if (!p) return;
    var q = cart[k];
    var price = fmtPrice(p.price);
    var sub = price === null ? null : price * q;
    lines.push(p.name + '  x' + q + '  = ' + (sub === null ? 'Negotiable' : '¥' + sub.toFixed(2)));
  });
  lines.push('--------------------------------');
  lines.push('TOTAL: ¥' + cartTotal().toFixed(2));
  return lines.join('\n');
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert('Order copied! Paste it to send via WeChat / Email.'); }
  catch(e) { prompt('Copy manually:', text); }
  document.body.removeChild(ta);
}
function copyInvoice() {
  var text = invoiceText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ alert('Order copied! Paste it to send via WeChat / Email.'); }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function printInvoice() {
  document.body.classList.add('printing-invoice');
  window.print();
  setTimeout(function(){ document.body.classList.remove('printing-invoice'); }, 500);
}
function submitOrder() {
  var name = document.getElementById('ivName').value.trim();
  var phone = document.getElementById('ivPhone').value.trim();
  var wechat = document.getElementById('ivWechat').value.trim();
  if (!name && !phone) { alert('Please fill in your name or phone so we can contact you.'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  var data = {
    name: name,
    phone: phone,
    wechat: wechat,
    total: '¥' + cartTotal().toFixed(2),
    order: invoiceText(),
    _subject: 'New Order - ' + (name || 'Customer')
  };
  fetch('https://formspree.io/f/maeyerdz', {
    method: 'POST',
    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function(res) {
    if (res.ok) {
      alert('Order submitted successfully! We will contact you soon.');
      closeInvoice();
      clearCart();
    } else {
      alert('Submit failed. Please use "Copy Order" and send it to us manually.');
    }
    btn.disabled = false; btn.textContent = '📤 Submit Order';
  }).catch(function() {
    alert('Network error. Please use "Copy Order" and send it to us manually.');
    btn.disabled = false; btn.textContent = '📤 Submit Order';
  });
}
document.getElementById('invoiceModal').addEventListener('click', function(e){ if (e.target === this) closeInvoice(); });
updateCartUI();

render();
</script>
</body>
